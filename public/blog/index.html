<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Invoicing Tips & Freelance Guides | InvoiceForge</title>
  <meta name="description" content="Expert guides on invoicing, freelancing, and getting paid faster. Tips for small businesses, consultants, and independent professionals.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://invoiceforge-production-3495.up.railway.app/blog">
  <meta property="og:title" content="InvoiceForge Blog — Invoicing Tips & Freelance Guides">
  <meta property="og:description" content="Expert guides on invoicing, freelancing, and getting paid faster.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="/css/landing.css">
  <link rel="stylesheet" href="/css/blog.css">
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <a href="/" class="logo"><span class="logo-icon">&#9670;</span> InvoiceForge</a>
    <nav class="nav-links">
      <a href="/app">Open App</a>
      <a href="/blog" style="color:var(--primary);font-weight:700">Blog</a>
    </nav>
  </div>
</header>

<section class="blog-hero">
  <div class="section-inner" style="padding-bottom:40px">
    <h1>InvoiceForge Blog</h1>
    <p class="section-sub" style="margin-bottom:0">Invoicing guides, freelance tips, and small business insights.</p>
  </div>
</section>

<section>
  <div class="section-inner" style="padding-top:0">
    <div class="blog-grid" id="blogGrid">
    </div>
  </div>
</section>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-bottom" style="border:none;padding-top:0;margin-top:0">
      <p>&copy; 2026 InvoiceForge. All rights reserved.</p>
    </div>
  </div>
</footer>

<script>
// Static fallback posts shown when the API is unavailable (e.g. local dev without content/blog/)
var STATIC_POSTS = [
  { slug: 'how-to-create-professional-invoice', title: 'How to Create a Professional Invoice That Gets You Paid Faster', excerpt: 'Learn the 7 essential elements every professional invoice needs.', date: '2026-06-06', category: 'Guides', readTime: '5 min read' },
  { slug: 'best-invoicing-practices-freelancers', title: '10 Invoicing Best Practices Every Freelancer Should Follow', excerpt: 'Stop chasing late payments with these proven invoicing practices.', date: '2026-06-05', category: 'Freelancing', readTime: '6 min read' },
  { slug: 'free-vs-paid-invoice-generators', title: 'Free vs Paid Invoice Generators: Which One Is Right for Your Business?', excerpt: 'Compare free and paid invoicing tools and what features matter.', date: '2026-06-04', category: 'Tools', readTime: '4 min read' },
  { slug: 'invoice-templates-for-small-business', title: '5 Invoice Templates Every Small Business Should Have', excerpt: 'Essential templates that cover 90% of small business billing.', date: '2026-06-03', category: 'Templates', readTime: '5 min read' },
  { slug: 'getting-paid-faster-freelance-tips', title: 'Getting Paid Faster: 8 Tips for Freelancers and Consultants', excerpt: 'Practical strategies to reduce payment delays.', date: '2026-06-02', category: 'Freelancing', readTime: '5 min read' },
  { slug: 'what-to-include-in-an-invoice', title: 'What to Include in an Invoice: The Complete Checklist', excerpt: 'A comprehensive checklist of every field your invoice should include.', date: '2026-06-01', category: 'Guides', readTime: '4 min read' }
];

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderPost(post, isDynamic) {
  var link = isDynamic ? '/blog/post/' + post.slug : '/blog/' + post.slug;
  var card = document.createElement('article');
  card.className = 'blog-card';
  card.innerHTML =
    '<div class="blog-card-meta">' +
      '<span class="blog-category">' + escHtml(post.category) + '</span>' +
      '<span class="blog-date">' + escHtml(post.date) + '</span>' +
      '<span class="blog-readtime">' + escHtml(post.readTime) + '</span>' +
    '</div>' +
    '<h2><a href="' + link + '">' + escHtml(post.title) + '</a></h2>' +
    '<p class="blog-excerpt">' + escHtml(post.excerpt) + '</p>' +
    '<a href="' + link + '" class="blog-readmore">Read article →</a>';
  return card;
}

(function loadBlog() {
  var grid = document.getElementById('blogGrid');
  grid.innerHTML = '<p style="color:var(--text-muted);text-align:center">Loading articles...</p>';

  fetch('/api/blog-list')
    .then(function(res) {
      if (!res.ok) throw new Error('API error');
      return res.json();
    })
    .then(function(posts) {
      if (posts.length > 0) {
        grid.innerHTML = '';
        posts.forEach(function(p) { grid.appendChild(renderPost(p, true)); });
        return;
      }
      throw new Error('empty');
    })
    .catch(function() {
      grid.innerHTML = '';
      STATIC_POSTS.forEach(function(p) { grid.appendChild(renderPost(p, false)); });
    });
})();
</script>
</body>
</html>
