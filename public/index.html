<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvoiceForge — Professional Invoice Generator</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">◆</span>
        <span class="brand-name">InvoiceForge</span>
      </div>
      <div class="sidebar-nav">
        <a href="#" class="nav-item active" data-view="dashboard">
          <span class="nav-icon">◫</span> Dashboard
        </a>
        <a href="#" class="nav-item" data-view="invoices">
          <span class="nav-icon">▤</span> Invoices
        </a>
        <a href="#" class="nav-item" data-view="clients">
          <span class="nav-icon">●</span> Clients
        </a>
        <a href="#" class="nav-item" data-view="settings">
          <span class="nav-icon">⚙</span> Settings
        </a>
      </div>
      <div class="sidebar-footer">
        <div class="tier-badge" id="tierBadge">Free · <span id="tierRemaining">3</span> left</div>
      </div>
    </nav>

    <!-- Main content -->
    <main class="main" id="mainContent">
      <!-- Views loaded dynamically -->
    </main>
  </div>

  <!-- Modal overlay -->
  <div class="modal-overlay" id="modalOverlay" style="display:none"></div>
  <div class="modal" id="modal" style="display:none"></div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/app.js"></script>
</body>
</html>
