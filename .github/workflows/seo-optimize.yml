# InvoiceForge SEO Content Optimizer
# 每周六 UTC 08:00 自动运行（北京时间 16:00）
# 扫描老化文章 → 拉取流量数据 → DeepSeek 优化 → git push

name: SEO Content Optimizer

on:
  schedule:
    - cron: "0 8 * * 6"
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai

      - name: Run Content Optimizer
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANALYTICS_ENDPOINT: ${{ secrets.ANALYTICS_ENDPOINT }}
          GIT_USER_NAME: "invoiceforge-bot"
          GIT_USER_EMAIL: "bot@invoiceforge.app"
        run: python scripts/seo_content_optimizer.py
