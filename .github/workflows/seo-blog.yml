# InvoiceForge SEO Blog Auto-Generator
# 每周一/三/五 UTC 08:00 自动运行（北京时间 16:00）
# 也可在 GitHub Actions 页面手动触发 (workflow_dispatch)

name: SEO Blog Generator

on:
  schedule:
    # 周一/三/五 08:00 UTC = 北京时间 16:00
    - cron: "0 8 * * 1,3,5"
  workflow_dispatch:
    inputs:
      keyword:
        description: "指定关键词（留空则随机）"
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai

      - name: Generate & Deploy SEO Article
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANALYTICS_ENDPOINT: ${{ secrets.ANALYTICS_ENDPOINT }}
          GIT_USER_NAME: "invoiceforge-bot"
          GIT_USER_EMAIL: "bot@invoiceforge.app"
        run: |
          if [ -n "${{ github.event.inputs.keyword }}" ]; then
            python scripts/seo_blog_generator.py --ci --keyword "${{ github.event.inputs.keyword }}"
          else
            python scripts/seo_blog_generator.py --ci
          fi
